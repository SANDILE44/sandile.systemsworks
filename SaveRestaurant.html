<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Restaurant Deals - Sandile SystemsWorks</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-saved-deal-type="restaurant">
  <div id="loader" class="loader-overlay" style="display:none;">
    <div class="loader-content">
      <div class="spinner"></div>
      <p class="loader-text">Fetching Projects...</p>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <img src="images/Untitled design.png" class="sidebar-logo" alt="Sandile SystemsWorks" />
          <span class="sidebar-name">Sandile SystemsWorks</span>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link">
            <i data-lucide="layout-grid"></i>
            <span>Dashboard</span>
          </a>
          <a href="industry-restaurants.html" class="nav-link">
            <i data-lucide="utensils"></i>
            <span>Restaurant Tool</span>
          </a>
          <hr class="sidebar-divider" />
          <a href="SaveRestaurant.html" class="nav-link active" aria-current="page">
            <i data-lucide="bookmark"></i>
            <span>Saved Deals</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="sidebar-account">
          <button id="accountBtn" class="account-btn" type="button">
            <span id="accountAvatar" class="account-avatar">U</span>
            <div class="account-info">
              <span id="accountName" class="account-name">Account</span>
              <i data-lucide="chevron-up" class="chevron"></i>
            </div>
          </button>

          <div id="accountMenu" class="account-menu">
            <a href="index.html"><i data-lucide="home"></i> Home</a>
            <button id="logoutBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <button id="hamburger" class="hamburger" type="button" aria-label="Open menu" aria-controls="app-sidebar" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <div class="saved-container">
        <div class="page-header">
          <h1>Saved Restaurant Deals</h1>
          <p>Review and manage your analyzed restaurant projects.</p>
          <div class="search-wrapper">
            <div class="search-input-container">
              <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
              <input id="searchInput" name="projectSearch" type="search" placeholder="Search by project, profit, revenue, or status..." autocomplete="off" aria-label="Search saved restaurant projects" />
            </div>
            <div id="searchMeta" class="industry-meta" aria-live="polite">Showing all projects</div>
          </div>
        </div>

        <div id="savedDealsContainer" class="deals-grid"></div>

        <div id="emptyState" class="empty" style="display:none;">
          <i data-lucide="folder-open"></i>
          <p>No restaurant deals yet.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hamburger.js"></script>
  <script src="js/user-display.js"></script>
  <script src="js/button-loading.js"></script>
  <script src="js/savedDeals.js"></script>
  <script>lucide.createIcons();</script>
</body>

</html>

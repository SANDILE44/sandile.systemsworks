<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Create Account - Sandile SystemsWorks</title>  
    
    <!-- TAILWIND CORE ENGINE -->
    <script src="https://cdn.tailwindcss.com"></script>  
    
    <!-- GOOGLE IDENTITY SERVICES ENGINE -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>  
    
    <style>  
        /* ── SYSTEM DESIGN SYSTEM VARIABLES ── */
        :root {  
            --bg-main: #020617;  
            --accent: #00b4d8;  
            --border-soft: rgba(255, 255, 255, 0.06);  
        }  

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: #e5e7eb;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .glass {  
            background: rgba(255, 255, 255, 0.02);  
            backdrop-filter: blur(16px);  
            border: 1px solid var(--border-soft);  
        }  

        /* ── AUTH CARD ARCHITECTURE ── */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 2rem 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 180, 216, 0.02);
            box-shadow: 0 0 12px rgba(0, 180, 216, 0.1);
        }

        .auth-submit {
            width: 100%;
            background: var(--accent);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.2em;
            padding: 1rem;
            border-radius: 2px;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-submit:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .auth-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #msg {
            font-size: 12px;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        #msg.error {
            color: #ef4444;
        }

        /* ── SYSTEMSWORKS INTERACTIVE LOADER OVERLAY ── */  
        #g-overlay {  
            position: fixed;  
            inset: 0;  
            background: rgba(2, 6, 23, 0.96);  
            backdrop-filter: blur(12px);  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            z-index: 9999;  
            opacity: 0;  
            transition: opacity 0.35s ease;  
        }  
          
        .g-wrap {  
            position: relative;  
            width: 110px;  
            height: 110px;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
        }  
          
        .g-ring {  
            position: absolute;  
            inset: 0;  
            border-radius: 50%;  
            border: 2.5px solid rgba(0, 180, 216, 0.1);  
            border-top-color: var(--accent);  
            animation: gSpin 0.85s linear infinite;  
            box-shadow: 0 0 24px rgba(0, 180, 216, 0.15);  
        }  
          
        @keyframes gSpin {  
            to { transform: rotate(360deg); }  
        }  
          
        .g-logo {  
            width: 56px;  
            height: 56px;  
            object-fit: contain;  
            position: relative;  
            z-index: 1;  
            animation: gLogoPulse 1.4s ease-in-out infinite;  
        }  
          
        @keyframes gLogoPulse {  
            0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.4)); }  
            50%      { filter: drop-shadow(0 0 30px rgba(0, 180, 216, 0.8)); }  
        }  
          
        .g-glow {  
            position: absolute;  
            width: 200px;  
            height: 200px;  
            border-radius: 50%;  
            background: radial-gradient(circle, rgba(0, 180, 216, 0.1) 0%, transparent 70%);  
            animation: gGlowPulse 1.4s ease-in-out infinite;  
            pointer-events: none;  
        }  
          
        @keyframes gGlowPulse {  
            0%, 100% { transform: scale(1); opacity: 0.7; }  
            50%      { transform: scale(1.2); opacity: 1; }  
        }  
          
        /* SUCCESS STATE CHECKMARK */  
        .g-check-wrap {  
            position: absolute;  
            inset: 0;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            opacity: 0;  
            transition: opacity 0.3s ease;  
        }  
          
        .g-circle {  
            position: absolute;  
            inset: 0;  
            border-radius: 50%;  
            border: 2.5px solid #00e87a;  
            transform: scale(0);  
        }  
          
        .g-check-svg {  
            width: 40px;  
            height: 40px;  
            stroke: #00e87a;  
            stroke-width: 2.5;  
            stroke-linecap: round;  
            stroke-linejoin: round;  
            fill: none;  
            position: relative;  
            z-index: 1;  
            filter: drop-shadow(0 0 8px rgba(0, 232, 122, 0.9));  
        }  
          
        .g-check-path {  
            stroke-dasharray: 30;  
            stroke-dashoffset: 30;  
            transition: stroke-dashoffset 0.45s ease 0.2s;  
        }  
    </style>  
</head>  
<body class="antialiased">  

    <!-- TOP NAVIGATION -->  
    <nav class="fixed w-full z-50 top-0 glass border-b border-white/5">  
        <div class="max-w-7xl mx-auto px-6 lg:px-8">  
            <div class="flex items-center justify-between h-20">  
                <!-- CLICKABLE LOGO TO HOMEPAGE -->
                <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">  
                    <img src="images/Untitled design.png" alt="Logo" class="h-8 w-auto">  
                    <span class="text-lg font-bold tracking-tighter text-white uppercase italic">  
                        Sandile <span class="text-[#00b4d8]">SystemsWorks</span>  
                    </span>  
                </a>  
                <div>  
                    <a href="login.html" class="text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition">
                        Sign in
                    </a>  
                </div>  
            </div>  
        </div>  
    </nav>  

    <!-- MAIN CENTERED CONTENT CONTAINER -->  
    <main class="auth-wrapper">  
        <div class="auth-card">  
            <div class="text-center mb-8">  
                <!-- CLICKABLE CARD LOGO TO HOMEPAGE -->
                <a href="index.html" class="inline-block mb-4 hover:opacity-80 transition">
                    <img src="images/Untitled design.png" alt="Logo" class="h-10 w-auto mx-auto">  
                </a>
                <h1 class="text-2xl font-extrabold text-white tracking-tight uppercase italic mb-1">Create your account</h1>  
                <p class="text-xs text-slate-400 font-light">Start your <strong class="text-[#00b4d8] font-semibold">7 day free trial</strong> and make smarter decisions.</p>  
            </div>

            <!-- ── GOOGLE AUTH PLATFORM MOUNT ELEMENT ── -->
            <div class="flex justify-center w-full">
                <div id="g_id_onload"
                     data-client_id="1064963647591-k76sv5dgcm3ihrsbmaccr63rij0vikda.apps.googleusercontent.com"
                     data-context="signup"
                     data-ux_mode="popup"
                     data-callback="handleGoogleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="filled_black"
                     data-text="signup_with"
                     data-size="large"
                     data-logo_alignment="left"
                     data-width="360">
                </div>
            </div>

            <!-- ── ORBITAL BREAK LINE ── -->
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-white/5"></div>
                <span class="flex-shrink mx-4 text-[10px] text-slate-500 font-bold uppercase tracking-widest">OR</span>
                <div class="flex-grow border-t border-white/5"></div>
            </div>

            <form id="signupForm">  
                <div class="form-group">  
                    <label for="name">Full name</label>  
                    <input type="text" id="name" placeholder="Your name" required>  
                </div>  
                <div class="form-group">  
                    <label for="email">Email address</label>  
                    <input type="email" id="email" placeholder="your@email.com" required>  
                </div>  
                <div class="form-group">  
                    <label for="password">Password</label>  
                    <input type="password" id="password" placeholder="Minimum 8 characters" required>  
                </div>  
                <button type="submit" class="auth-submit">Create account</button>  
                <p id="msg"></p>  
            </form>  

            <div class="text-center mt-6 text-xs text-slate-500">  
                Already have an account? <a href="login.html" class="text-[#00b4d8] hover:underline">Sign in</a>  
            </div>  
        </div>  
    </main>  

    <!-- CONFIGURATION AND API SCRIPTS LINKS -->
    <script src="js/config.js"></script>  
    <script src="js/api.js"></script>  
    <script src="js/auth.js"></script>  

    <!-- ENGINE CONTROLLER INTERACTION SCRIPTS -->
    <script>  
        const signupForm = document.getElementById('signupForm');  
        const msg = document.getElementById('msg');  
          
        function showMsg(text, type='') {  
            msg.textContent = text;  
            msg.className = type;  
            msg.style.display = text ? 'block' : 'none';  
        }  
          
        /* ── DYNAMIC SYSTEM OVERLAY GENERATOR ── */  
        function showOverlay() {  
            const overlay = document.createElement('div');  
            overlay.id = 'g-overlay';  
              
            const glow = document.createElement('div');  
            glow.className = 'g-glow';  
              
            const wrap = document.createElement('div');  
            wrap.className = 'g-wrap';  
              
            const ring = document.createElement('div');  
            ring.className = 'g-ring';  
              
            const logo = document.createElement('img');  
            logo.src = 'images/Untitled design.png';  
            logo.alt = 'Logo';  
            logo.className = 'g-logo';  
              
            const checkWrap = document.createElement('div');  
            checkWrap.className = 'g-check-wrap';  
              
            const circle = document.createElement('div');  
            circle.className = 'g-circle';  
              
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');  
            svg.setAttribute('viewBox', '0 0 24 24');  
            svg.classList.add('g-check-svg');  
              
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');  
            path.setAttribute('d', 'M5 13 l5 5 l9 -9');  
            path.classList.add('g-check-path');  
              
            svg.appendChild(path);  
            checkWrap.appendChild(circle);  
            checkWrap.appendChild(svg);  
            wrap.appendChild(ring);  
            wrap.appendChild(logo);  
            wrap.appendChild(checkWrap);  
            overlay.appendChild(glow);  
            overlay.appendChild(wrap);  
            document.body.appendChild(overlay);  
              
            let stats = overlay.offsetHeight;
            overlay.style.opacity = '1';  
              
            return { overlay, ring, logo, checkWrap, circle, path };  
        }  
          
        function triggerSuccess({ overlay, ring, logo, checkWrap, circle, path }) {  
            ring.style.transition = 'opacity 0.3s ease';  
            ring.style.opacity = '0';  
            logo.style.transition = 'opacity 0.3s ease';  
            logo.style.opacity = '0';  
              
            setTimeout(() => {  
                checkWrap.style.opacity = '1';  
                circle.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';  
                circle.style.transform = 'scale(1)';  
                circle.style.boxShadow = '0 0 30px rgba(0,232,122,0.6)';  
                path.style.strokeDashoffset = '0';  
            }, 300);  
              
            setTimeout(() => {  
                overlay.style.transition = 'opacity 0.4s ease';  
                overlay.style.opacity = '0';  
                setTimeout(() => overlay.remove(), 400);  
            }, 1600);  
        }  
          
        /* ── INDUSTRIAL EMAIL SIGNUP HANDLER ── */  
        signupForm.addEventListener('submit', async (e) => {  
            e.preventDefault();  
              
            const name     = document.getElementById('name').value.trim();  
            const email    = document.getElementById('email').value.trim();  
            const password = document.getElementById('password').value;  
            const btn      = signupForm.querySelector('button');  
              
            showMsg('');  
              
            if (!name)             return showMsg('Enter your name', 'error');  
            if (!email)            return showMsg('Enter your email', 'error');  
            if (password.length < 8) return showMsg('Password must be at least 8 characters', 'error');  
              
            btn.disabled = true;  
              
            const elements = showOverlay();  
              
            try {  
                const data = await window.api.signupRequest(name, email, password);  
              
                if (!data?.token) throw new Error('Signup failed');  
              
                if (window.auth && typeof window.auth.setToken === 'function') {
                    window.auth.setToken(data.token);
                } else {
                    localStorage.setItem('token', data.token);
                }
              
                triggerSuccess(elements);  
              
                setTimeout(() => {  
                    window.location.replace('dashboard.html');  
                }, 1800);  
              
            } catch (err) {  
                elements.overlay.remove();  
                btn.disabled = false;  
                showMsg(err.message || 'Signup failed', 'error');  
            }  
        });  

        /* ── GLOBAL GOOGLE OAUTH INTERACTION HANDLER ── */
        async function handleGoogleCredentialResponse(response) {
            showMsg('');
            const submitBtn = signupForm.querySelector('button');
            submitBtn.disabled = true;
            
            const uiElements = showOverlay();
            
            try {
                const apiBase = (window.CONFIG && window.CONFIG.API_BASE) || window.API_BASE || 'https://sandile-systemsworks-saas-backend-2.onrender.com';
                
                const backendRes = await fetch(`${apiBase}/api/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });
                
                const data = await backendRes.json();
                
                if (!backendRes.ok || data.error || !data.token) {
                    throw new Error(data.error || data.message || 'Google authentication handshake rejected.');
                }
                
                if (window.auth && typeof window.auth.setToken === 'function') {
                    window.auth.setToken(data.token);
                } else {
                    localStorage.setItem('token', data.token);
                }
                
                triggerSuccess(uiElements);
                
                setTimeout(() => {  
                    window.location.replace('dashboard.html');  
                }, 1800);
                
            } catch (err) {
                uiElements.overlay.remove();
                submitBtn.disabled = false;
                showMsg(err.message || 'Google signup execution failed.', 'error');
            }
        }
    </script>  
</body>  
</html>
